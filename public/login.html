<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — Shut Up and Read</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="top">
      <h1>Shut Up and Read</h1>
    </header>
    <main class="auth">
      <h2>Log in</h2>
      <form id="form">
        <input name="username" placeholder="username" autocomplete="username" required />
        <input name="password" type="password" placeholder="password" autocomplete="current-password" required />
        <button type="submit">Log in</button>
      </form>
      <p class="error" id="error"></p>
      <p>No account? <a href="/register">Register</a></p>
      <hr class="divider" />
      <button type="button" id="guest-btn">Continue anonymously</button>
      <p class="warning">
        No account — a random name, nothing saved when you leave, no stats or ranking.
      </p>
    </main>
    <script>
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (res.ok) {
          window.location.href = "/";
        } else {
          const body = await res.json().catch(() => ({}));
          document.getElementById("error").textContent = body.error ?? "login failed";
        }
      });

      document.getElementById("guest-btn").addEventListener("click", async () => {
        const res = await fetch("/auth/guest", { method: "POST" });
        if (res.ok) window.location.href = "/";
      });
    </script>
  </body>
</html>
