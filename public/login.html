<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in — Shut Up and Read</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="top">
      <h1>Shut Up and Read</h1>
    </header>
    <main class="auth">
      <h2>Log in</h2>
      <form id="form">
        <input name="username" placeholder="username" autocomplete="username" required />
        <input name="password" type="password" placeholder="password" autocomplete="current-password" required />
        <button type="submit">Log in</button>
      </form>
      <p class="error" id="error"></p>
      <p>No account? <a href="/register">Register</a></p>
      <hr class="divider" />
      <button type="button" id="guest-btn">Continue anonymously</button>
      <p class="error" id="guest-error"></p>
      <p class="warning">
        No account — a random name, nothing saved when you leave, no stats or ranking.
      </p>
    </main>
    <script>
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (res.ok) {
          window.location.href = "/";
        } else {
          const body = await res.json().catch(() => ({}));
          document.getElementById("error").textContent = body.error ?? "login failed";
        }
      });

      // The app's Fly machine scales to zero and cold-starts on the next
      // request, which can take a couple of seconds — a request that lands
      // in that window fails outright rather than 4xx-ing, and with no retry
      // or feedback this button looked simply dead. One retry rides out a
      // cold start; a visible message covers the rare case it doesn't.
      document.getElementById("guest-btn").addEventListener("click", async () => {
        const btn = document.getElementById("guest-btn");
        const errorEl = document.getElementById("guest-error");
        errorEl.textContent = "";
        btn.disabled = true;
        try {
          let res;
          try {
            res = await fetch("/auth/guest", { method: "POST" });
          } catch {
            await new Promise((r) => setTimeout(r, 2000));
            res = await fetch("/auth/guest", { method: "POST" });
          }
          if (res.ok) {
            window.location.href = "/";
            return;
          }
          errorEl.textContent = "Couldn't start a guest session — try again.";
        } catch {
          errorEl.textContent = "Couldn't reach the server — try again.";
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
